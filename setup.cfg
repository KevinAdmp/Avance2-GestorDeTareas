[flake8]
max-line-length = 120
exclude =
    app/templates,
    app/static,
    .venv,
    __pycache__
# E221: multiple spaces before operator (alineación visual, no es error de seguridad)
# E272: multiple spaces before keyword (mismo caso)
# W503: line break before binary operator (estilo personal)
extend-ignore = E221,E272,W503
