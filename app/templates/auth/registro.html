{% extends "base.html" %}
{% block title %}Registro — TaskBoard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card p-4">
      <h2 class="mb-3">Crear cuenta</h2>
      <form method="POST" novalidate>
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre</label>
          <input type="text" id="nombre" name="nombre" class="form-control"
                 required maxlength="80" />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Correo electrónico</label>
          <input type="email" id="email" name="email" class="form-control" required />
        </div>
        <div class="mb-3">
          <label for="password" class="form-label">Contraseña</label>
          <input type="password" id="password" name="password"
                 class="form-control" required minlength="8" />
        </div>
        <div class="mb-4">
          <label for="confirma" class="form-label">Confirmar contraseña</label>
          <input type="password" id="confirma" name="confirma"
                 class="form-control" required />
        </div>
        <button type="submit" class="btn btn-primary w-100">Registrarse</button>
      </form>
      <p class="mt-3 text-center">
        ¿Ya tienes cuenta? <a href="{{ url_for('auth.login') }}">Inicia sesión</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
