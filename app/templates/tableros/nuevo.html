{% extends "base.html" %}
{% block title %}Nuevo Tablero — TaskBoard{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <h2 class="mb-3">Nuevo Tablero</h2>
    <div class="card p-4">
      <form method="POST">
        <div class="mb-3">
          <label for="nombre" class="form-label">Nombre del tablero</label>
          <input type="text" id="nombre" name="nombre" class="form-control"
                 required maxlength="120" />
        </div>
        <div class="mb-4">
          <label for="descripcion" class="form-label">Descripción (opcional)</label>
          <textarea id="descripcion" name="descripcion" class="form-control"
                    rows="3"></textarea>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">Crear</button>
          <a href="{{ url_for('tableros.index') }}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
